name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install database CLI and native development libraries
        run: |
          command -v sqlite3 || { sudo apt-get update && sudo apt-get install -y sqlite3; }
          dpkg -s libsqlite3-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libsqlite3-dev; }
          dpkg -s libpq-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libpq-dev; }
          dpkg -s freetds-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y freetds-dev; }
          dpkg -s libmysqlclient-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libmysqlclient-dev; }

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}

      # Warnings fail the build, as they do for a project that builds with --wfail.
      - name: Build
        run: lake build --wfail

      - name: Build a downstream package in the module system, with --wfail
        working-directory: downstream/module
        run: lake build --wfail

      - name: Unit golden tests (SQL text + params, 4 dialects)
        run: lake test

      - name: Native SQLite driver tests (typed, Values-to-Values vs the evaluator)
        run: lake exe sqlitedriver

      - name: Start databases
        run: docker compose up -d --wait

      # the driver exes exit 0 when the engine is unreachable (probe-skip, for
      # local dev) — in CI the engines must be there, so require the verdict line
      - name: Native PostgreSQL driver tests (typed, over the wire protocol)
        run: |
          lake exe pgdriver | tee pg-sweep.out
          grep -q '^driver(postgres): .*all green$' pg-sweep.out

      - name: Native SQL Server driver tests (typed, over TDS RPC)
        run: |
          lake exe mssqldriver | tee ms-sweep.out
          grep -q '^driver(mssql): .*all green$' ms-sweep.out

      - name: Native MySQL driver tests (typed, over prepared statements)
        run: |
          lake exe mysqldriver | tee mysql-sweep.out
          grep -q '^driver(mysql): .*all green$' mysql-sweep.out

      - name: Integration tests (all four engines required)
        run: lake exe integration --db sqlite,postgres,mssql,mysql

      - name: Stop databases
        if: always()
        run: docker compose down -v

  # A package outside lean-linq that imports one driver gets that driver's shim
  # and client library from Lake, and needs no other client library installed.
  downstream-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep only the PostgreSQL client development files
        run: |
          sudo apt-get remove -y libsqlite3-dev freetds-dev libmysqlclient-dev
          dpkg -s libpq-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libpq-dev; }

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and run a downstream program that uses the PostgreSQL driver
        working-directory: downstream/postgres
        run: |
          lake build
          lake exe pgcheck

  # The same check for the SQLite driver, on both platforms. On macOS the
  # program has no link settings of its own.
  downstream-sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite's development files
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew list sqlite >/dev/null 2>&1 || brew install sqlite
          else
            dpkg -s libsqlite3-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libsqlite3-dev; }
          fi

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and run a downstream program that uses the SQLite driver
        working-directory: downstream/sqlite
        run: |
          lake build
          lake exe sqlitecheck

